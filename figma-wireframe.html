<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Wireframe</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
  <main class="wireframe-shell">
    <header class="wf-bar">
      <div class="wf-pill short">Logo</div>
      <div class="wf-nav">
        <span class="wf-pill">Projects</span>
        <span class="wf-pill">Process</span>
        <span class="wf-pill">About</span>
        <span class="wf-pill">Contact</span>
      </div>
    </header>

    <section class="wf-section wf-hero">
      <div class="wf-copy">
        <span class="wf-label">Hero</span>
        <div class="wf-line xl"></div>
        <div class="wf-line xl"></div>
        <div class="wf-line lg"></div>
        <div class="wf-line md"></div>
        <div class="wf-buttons">
          <span class="wf-pill dark">Primary CTA</span>
          <span class="wf-pill">Secondary CTA</span>
        </div>
      </div>
      <div class="wf-card-grid">
        <div class="wf-card large">
          <span class="wf-label">Signal Card</span>
        </div>
        <div class="wf-card">
          <span class="wf-label">Support Card</span>
        </div>
        <div class="wf-card">
          <span class="wf-label">Support Card</span>
        </div>
      </div>
    </section>

    <section class="wf-strip">
      <span>Scrolling Expertise Strip</span>
    </section>

    <section class="wf-section">
      <span class="wf-label">Manifesto / Process</span>
      <div class="wf-grid three">
        <div class="wf-card tall"></div>
        <div class="wf-card tall"></div>
        <div class="wf-card tall"></div>
      </div>
    </section>

    <section class="wf-section">
      <span class="wf-label">Projects</span>
      <div class="wf-projects">
        <div class="wf-list">
          <div class="wf-card tile"></div>
          <div class="wf-card tile"></div>
          <div class="wf-card tile"></div>
        </div>
        <div class="wf-card preview">
          <span class="wf-label">Sticky Project Preview</span>
          <div class="wf-preview-grid">
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="wf-section">
      <span class="wf-label">Interaction Lab</span>
      <div class="wf-lab">
        <div class="wf-card tabs"></div>
        <div class="wf-card content"></div>
      </div>
    </section>

    <section class="wf-section">
      <span class="wf-label">Evidence Cards</span>
      <div class="wf-grid three">
        <div class="wf-card tall"></div>
        <div class="wf-card tall"></div>
        <div class="wf-card tall"></div>
      </div>
    </section>

    <section class="wf-section">
      <span class="wf-label">About</span>
      <div class="wf-about">
        <div class="wf-card about-main"></div>
        <div class="wf-stack">
          <div class="wf-card"></div>
          <div class="wf-card"></div>
          <div class="wf-card"></div>
        </div>
      </div>
    </section>

    <section class="wf-section">
      <span class="wf-label">Contact</span>
      <div class="wf-card contact"></div>
    </section>
  </main>
</body>
</html>
